{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
  <header class="mb-8">
    <div class="inline-block px-2.5 py-0.5 bg-primary/10 text-primary text-xs font-semibold uppercase tracking-wider rounded mb-3">
      Institutional Archive
    </div>
    <h1 class="text-2xl sm:text-4xl font-serif font-bold text-base-content tracking-tight mb-4">Search Institutional Records</h1>
    
    <form action="{% url 'search' %}" method="get" class="flex gap-2">
      <div class="relative flex-grow">
        <input 
          type="text" 
          name="query" 
          value="{{ search_query|default:'' }}" 
          placeholder="Search keywords, faculty, departments, or document numbers..." 
          class="input input-bordered w-full pl-10 pr-4 text-sm" 
          hx-get="{% url 'search' %}" 
          hx-trigger="keyup changed delay:400ms" 
          hx-target="#search-results" 
          hx-indicator="#search-loading"
        />
        <svg class="w-4 h-4 text-base-content/40 absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <button type="submit" class="btn btn-primary text-xs font-semibold px-6">Search</button>
    </form>
    
    <div id="search-loading" class="htmx-indicator mt-2 text-xs text-base-content/60 flex items-center gap-2">
      <span class="loading loading-spinner loading-xs text-primary"></span> Searching repository...
    </div>
  </header>

  <div id="search-results">
    {% include "search/includes/search_results.html" %}
  </div>
</div>
{% endblock %}
