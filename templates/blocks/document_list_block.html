<div class="my-6">
  {% if value.title %}
    <h3 class="text-xl font-serif font-bold text-base-content mb-4">{{ value.title }}</h3>
  {% endif %}
  <div class="divide-y divide-base-300 border border-base-300 rounded-xl overflow-hidden bg-base-100">
    {% for item in value.documents %}
      {% if item.document %}
        <div class="p-4 flex items-center justify-between hover:bg-base-200/50 transition-colors">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <div>
              <p class="font-medium text-xs sm:text-sm text-base-content">{{ item.label|default:item.document.title }}</p>
              <span class="text-xs text-base-content/60 uppercase font-mono">{{ item.document.file_extension }} &bull; {{ item.document.get_file_size|filesizeformat }}</span>
            </div>
          </div>
          <a href="{{ item.document.url }}" class="btn btn-xs sm:btn-sm btn-outline btn-primary font-medium" download>
            Download
          </a>
        </div>
      {% endif %}
    {% endfor %}
  </div>
</div>
