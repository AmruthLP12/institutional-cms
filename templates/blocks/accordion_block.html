{% load wagtailcore_tags %}
<div class="my-6">
  {% if value.title %}
    <h3 class="text-xl font-serif font-bold text-primary mb-4">{{ value.title }}</h3>
  {% endif %}
  <div class="space-y-2">
    {% for item in value.items %}
      <div class="collapse collapse-plus bg-base-100 border border-base-200 rounded-lg">
        <input type="radio" name="accordion-{{ block.id }}" {% if forloop.first %}checked="checked"{% endif %} />
        <div class="collapse-title text-base font-semibold text-base-content">
          {{ item.question }}
        </div>
        <div class="collapse-content prose max-w-none text-base-content/80 text-sm">
          {{ item.answer|richtext }}
        </div>
      </div>
    {% endfor %}
  </div>
</div>
