<blockquote class="my-6 p-5 sm:p-6 border-l-4 border-accent bg-base-200 rounded-r-xl italic text-base sm:text-lg text-base-content leading-relaxed font-serif">
  <p class="mb-2">“{{ value.text }}”</p>
  {% if value.attribution %}
    <footer class="text-xs sm:text-sm font-sans font-semibold text-base-content/80 not-italic">
      &mdash; {{ value.attribution }}{% if value.attribution_title %}, <span class="text-xs font-normal opacity-75">{{ value.attribution_title }}</span>{% endif %}
    </footer>
  {% endif %}
</blockquote>
