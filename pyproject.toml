[project]
name = "nakashara-cms"
version = "0.1.0"
description = "Nakashara Institutional Website and CMS — Django + Wagtail"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=6.1.1,<6.2",
    "wagtail>=8.0,<8.1",
    "django-tailwind>=4.5.0",
    "honcho",
    "psycopg[binary]>=3.2.0",
    "whitenoise>=6.9.0",
    "gunicorn>=23.0.0",
    "python-decouple>=3.8",
    "Pillow>=11.0.0",
    "django-htmx>=1.21.0",
    "dj-database-url>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "factory-boy>=3.3.0",
    "ruff>=0.9.0",
    "pytest-cov",
    "djlint>=1.46.2",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".venv",
    ".agents",
    "docs",
    "node_modules",
    "migrations",
    "__pycache__",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length managed by formatter
    "B008",  # function calls in default arguments
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests/test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.djlint]
profile = "django"
ignore = "H006,H030,H031,H017,H021,H023,D018,T038,H043,H045"
indent = 2
max_line_length = 120
blank_line_after_tag = "load,extends"


